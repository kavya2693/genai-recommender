# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported outreach plan rows."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      plan = J('demo:assets/outreach_plan.json')
      for r in sheet['rows']:
          src = plan['rows'][r['pos']]
          for k in ('specialty', 'title', 'channel', 'p_chosen', 'snippet_ids', 'grounded'):
              if r[k] != src[k]:
                  return False
      same = all(sheet[k] == plan[k] for k in ('prescribers', 'rep_budget', 'channels', 'grounded'))
      return same and [r['pos'] for r in sheet['rows']] == [0, 1, 2, 9, 15, 66]
  def curve_matches():
      """HIST in s04-routes.html must equal the training log history."""
      html = T('demo:compositions/s04-routes.html')
      m = _re.search(r"const HIST = (\[.*?\]);", html, _re.S)
      hist = json.loads(m.group(1))
      log = [[h['epoch'], h['valid_ndcg10']] for h in J('outputs/bert4rec_training.json')['history']]
      return hist == log
  def draft_2651_ok():
      """Shown lines are verbatim in the draft; every number in it is in S19-S21 or the title."""
      md = T('outputs/drafts_llama3.2.md')
      sec = md.split('## Customer 2651')[1].split('## Customer')[0]
      text = sec.split('```text')[1].split('```')[0]
      shown = [
          'Subject: Educational Content for Neurology Professionals - Somnavel Elderly Patients Series, Part 5',
          'The most common adverse reaction with Somnavel in elderly patients was fatigue (4% of patients).',
          'For elderly patients, the recommended Somnavel dose is 5 mg once daily; no adjustment is needed at week 52.',
          'In the SOM-146 study, Somnavel reduced the primary endpoint by 47% versus comparator at week 52.',
      ]
      if not all(s in text for s in shown):
          return False
      sn = R('data/snippets.csv').set_index('snippet_id')
      allowed = set(_re.findall(r'\d+(?:\.\d+)?', ' '.join(sn.loc[[21, 20, 19], 'text']) + ' Somnavel elderly patients series, part 5'))
      nums = _re.findall(r'\d+(?:\.\d+)?', text)
      return len(nums) == 8 and all(n in allowed for n in nums)
