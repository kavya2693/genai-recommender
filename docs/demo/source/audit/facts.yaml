  - {id: F-04, slides: ["02", "05", "09"], label: "Content items in the catalogue", shown: "480 pieces of content / top-10 of 480 / 480-item catalogue", type: direct, source: "data/items.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/items.csv'))", fmt: "{:d}", expect: "480"}}
