  - {id: F-02, slides: ["01"], label: "Four everyday problems (same content per segment; channel by habit with scarce reps; approved claims only; old and new claims read alike)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 13-27", formula: "-",
     check: {expr: "all(grep('README.md', p) for p in [r'segment rule and a template', r'fixed headcount', r'compliance incident', r'read almost identically'])", fmt: bool}}
