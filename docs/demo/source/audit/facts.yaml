# Audit facts for the genai-recommender demo video.
# Read by docs/demo/source/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: genai-recommender
  title: "genai-recommender: demo video audit report"
  repo_url: https://github.com/kavya2693/genai-recommender
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 85.8
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [torch, sklearn, pandas, numpy]
  regenerate:
    - "make demo                                  # outputs/*.csv, summary.json, bert4rec_training.json, drafts_llama3.2.md (~4 min; needs ollama pull llama3.2)"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_outreach_plan.py docs/demo/source/assets/outreach_plan.json --region north   # ~6 min, retrains with seed 7"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/outreach_plan.json docs/demo/source/compositions/value.html --rows 0,1,2,9,15,66"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/genai-recommender-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/genai-recommender-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml --master docs/demo/source/renders/genai-recommender-master.mp4   # stills, checks, MD/DOCX/PDF"
  seeds: {data_generator: 7, bert4rec: 7, latency_sample_rng: 1, validation_users_rng: 0}
  run_time: "summary.json wall_seconds = 233.4 s for make demo (README: Apple M1 Pro laptop, 4 threads, no GPU, including three llama3.2 drafts); the slide 07 export took 351.9 s"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (20,000 prescribers, 480 items, two years, 489 claim snippets). Brand names are invented; the production data is proprietary."
    source: "src/genai_recommender/datagen.py:70-76 (Scale), :455 (seed=7), :66 (DAYS = 730); README 'The data'"
    figures: [F-03]
    all_figures: true
    edit: ["src/genai_recommender/datagen.py (Scale)"]
    rerun: ["make data", "make demo"]
  - id: A-02
    statement: "Channel policies are scored with the generator's true engagement probability for the channel each policy picks, on the same test touches (last 20% of sends by time). Real logs would need off-policy estimation or a randomised holdout."
    source: "src/genai_recommender/channel.py:267-321 (_policy_eval), :163-169 (time_split 70/10/20); README 'Known limitations'"
    figures: [F-50, F-51, F-52, F-54, F-57]
    edit: ["src/genai_recommender/channel.py"]
    rerun: ["make demo"]
  - id: A-03
    statement: "Rep visits are a fixed budget equal to the logged (historical) number of rep sends in the test window (13.3% of touches); visits go to the touches where a rep beats the best eligible digital channel by the widest predicted margin. The slide 07 export applies the same share to one region."
    source: "src/genai_recommender/channel.py:187-212 (assign_with_rep_budget), :297 (rep_budget); demo tools/export_outreach_plan.py (rep_share)"
    figures: [F-45, F-50, F-51, F-60]
    edit: ["src/genai_recommender/channel.py:297", "tools/export_outreach_plan.py"]
    rerun: ["make demo", "export_outreach_plan.py + inject_sheet.py"]
  - id: A-04
    statement: "Latency is measured on one laptop, 300 requests one at a time, one thread, stub drafter, no server or network hop; p50/p95 vary with machine load."
    source: "src/genai_recommender/cli.py:115-140 (request loop, threadpool_limits(limits=1), --latency-n 300); README 'Latency of the request path'"
    figures: [F-17, F-18, F-19, F-20, F-29, F-55, F-56, F-58]
    edit: ["src/genai_recommender/cli.py:71"]
    rerun: ["make demo"]
  - id: A-05
    statement: "The llama3.2 result is three demonstration drafts (3B model, CPU through Ollama, temperature 0.2), not a measured pass rate."
    source: "src/genai_recommender/rag.py:122-138 (OllamaLLM); cli.py:70 (--demo-n 3); README 'Latency of the request path'"
    figures: [F-28, F-29, F-30, F-40, F-42, F-43, F-70]
    edit: ["Makefile (demo target)", "src/genai_recommender/rag.py:130"]
    rerun: ["make demo"]
  - id: A-06
    statement: "The grounding check only checks numbers: every number in a draft must appear in a retrieved approved claim or the content title. Prose that misstates a claim passes (README 'Known limitations', biggest gap)."
    source: "src/genai_recommender/rag.py:163-174 (grounding_check)"
    figures: [F-10, F-14, F-42, F-43, F-46]
    edit: ["src/genai_recommender/rag.py:163-174"]
    rerun: ["make demo"]
  - id: A-07
    statement: "Claim retrieval is scored on 79 brand-topic queries with k = 3; the right claims are known by construction (approved snippets written for that brand and topic)."
    source: "src/genai_recommender/rag.py:64-104 (retrieval_eval), :53 (k = 3)"
    figures: [F-13, F-15, F-16, F-53]
    edit: ["src/genai_recommender/rag.py"]
    rerun: ["make demo"]
  - id: A-08
    statement: "Ranking uses a leave-last-out split (train on all but the last two reads, validate on the second-to-last, test on the last) after dropping prescribers with more than 40 reads in a day (link scanners). All rankers are scored over the full 480-item catalogue with seen items masked."
    source: "src/genai_recommender/data.py:12 (MAX_EVENTS_PER_DAY = 40), :62-84 (make_split); ranking.py:50-54"
    figures: [F-22, F-27, F-39, F-61, F-62, F-63, F-64, F-65, F-66]
    edit: ["src/genai_recommender/data.py"]
    rerun: ["make demo"]
  - id: A-09
    statement: "BERT4Rec configuration: 2 layers, 64 dimensions, 2 heads, 30-item window, up to 30 epochs evaluated every 2, early stop with patience 3 on validation NDCG@10 over 3,000 sampled prescribers, seed 7."
    source: "src/genai_recommender/bert4rec.py:19-35 (Config); ranking.py:62 (valid_users = 3000)"
    figures: [F-25, F-33, F-34, F-35, F-36, F-38]
    edit: ["src/genai_recommender/bert4rec.py:19-35"]
    rerun: ["make demo", "export_outreach_plan.py + inject_sheet.py"]
  - id: A-10
    statement: "Slide 07 plans one touch for every prescriber in the north region at the same point in time the request-path test uses (history before the held-out read), with the deterministic stub drafter. The export retrains every model with the repo's seeds; its ranking table reproduces outputs/ranking.csv exactly."
    source: "demo tools/export_outreach_plan.py; src/genai_recommender/cli.py:115-130 (request)"
    figures: [F-44, F-45, F-46, F-47, F-48, F-49]
    edit: ["tools/export_outreach_plan.py (--region)", "tools/inject_sheet.py (--rows)"]
    rerun: ["export_outreach_plan.py + inject_sheet.py", "hyperframes render"]
  - id: A-11
    statement: "Run times depend on the machine: the README run is an Apple M1 Pro laptop on 4 CPU threads, no GPU."
    source: "README 'The result' line 57; outputs/summary.json wall_seconds, bert4rec.train_seconds"
    figures: [F-36, F-37, F-71]
    edit: ["-"]
    rerun: ["make demo"]
  - id: A-12
    statement: "Video rounding: probabilities and NDCG to 3 decimals (2 on the slide 07 sheet), shares to 1 decimal or whole percent, latencies to 2 decimals (1 on slide 08), counts with thousands separators; '626k', '300k', '133k', '~4 min' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-13, F-21, F-25, F-28, F-29, F-47, F-50, F-52, F-55, F-56, F-71]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-13
    statement: "Slide 01 (industry, everyday problems) is general pharma-commercial knowledge used as context, backed by the README problem statement; it carries no numbers."
    source: "author's framing; README 'The problem'"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
