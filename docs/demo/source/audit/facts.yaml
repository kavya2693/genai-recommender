     check: {expr: "grep('src/genai_recommender/datagen.py', r'^DAYS = 730') and (lambda s: (pd.to_datetime(s.max()) - pd.to_datetime(s.min())).days)(R('data/interactions.csv.gz')['ts']) == 729", fmt: bool}}
  - {id: F-08, slides: ["02"], label: "Logged outbound sends", shown: "299,722 logged sends", type: direct, source: "data/sends.csv.gz", key: "row count", formula: "-",
