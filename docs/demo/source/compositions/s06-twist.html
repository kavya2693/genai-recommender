<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* 09 LESSON AND FIX: left = the finding with its evidence, right = what comes next (the repo has no fix built

        #twist-root { position: absolute; inset: 0; }
        #twist-root .eyebrow { color: var(--c-opt); }
        #twist-root .panel {

          background: var(--panel); padding: 30px 36px 0;
        }
        #twist-root .panel.fix { border: 3px dashed var(--c-opt); background: #0f2629; }
        #twist-root .tag {

          padding: 4px 14px; border-radius: 6px; color: #0a1119;

        #twist-root .lesson .tag { background: var(--c-risk); }
        #twist-root .fix .tag { background: var(--c-opt); }

        #twist-root .who small { display: block; margin-top: 4px; font-size: 22px; font-weight: 500; color: var(--ink-soft); }
        #twist-root .track { flex: 0 0 220px; position: relative; width: 220px; height: 30px; border-radius: 6px; background: rgba(200, 211, 222, 0.1); }
        #twist-root .fill { position: absolute; left: 0; top: 0; height: 30px; border-radius: 6px; background: #6b7b8e; transform-origin: left center; }
        #twist-root .val { flex: 0 0 116px; width: 116px; text-align: right; font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--ink); }

        #twist-root .chip.pick { color: #0a1119; background: var(--c-opt); }
        #twist-root .row.win .fill { background: var(--c-opt); }

        #twist-root .note {
          position: absolute; left: 36px; right: 36px; bottom: 26px; padding-top: 16px; border-top: 2px solid var(--line);
          font-size: 26px; line-height: 1.3; color: var(--ink-soft);
        }
        #twist-root .lesson .note em { font-style: normal; font-weight: 700; color: var(--c-risk); }
        #twist-root .fix .note em { font-style: normal; font-weight: 700; color: var(--ink); }
        #twist-root .arrow { position: absolute; left: 943px; top: 514px; width: 34px; height: 56px; }
        #twist-root .payoff {
          position: absolute; left: 120px; top: 848px; width: 1680px; height: 92px; padding: 0 30px; border-radius: 14px;
          border: 2px solid rgba(63, 216, 168, 0.6); background: rgba(63, 216, 168, 0.08);
          display: flex; align-items: center; gap: 22px; font-size: 28px; color: var(--ink); white-space: nowrap;
        }
        #twist-root .payoff .tag { background: var(--c-opt); flex: 0 0 auto; }
        #twist-root .payoff b { color: var(--c-opt); font-family: var(--mono); }
        #twist-root .payoff .soft { color: var(--ink-soft); }
      </style>
      <div id="twist-root" data-composition-id="twist" data-width="1920" data-height="1080">
        <div class="scene" id="twist-in">
          <div class="eyebrow" data-layout-allow-overlap id="twist-eyebrow">09 · Lesson and fix</div>
          <div class="scene-title" data-layout-allow-overlap id="twist-title">A last-read lookup beats the transformer. So next I blend the two.</div>
          <div class="scene-sub" id="twist-sub">NDCG@10 = how high the item each doctor really read next sits in our top 10 (1 = first). Higher is better.</div>

          <!-- bars on one shared scale in both panels: NDCG@10 0.5 = 220 px -->
          <div class="panel lesson" id="twist-left" style="left: 120px">
            <span class="tag">THE LESSON</span>
            <div class="head">It beats popularity, not the lookup</div>
            <div class="metric"><b>NDCG@10</b>, all 19,960 doctors, all 480 items</div>
            <div class="rows">
              <div class="row" id="twist-l1"><div class="who">BERT4Rec<small>the transformer</small></div>
                <div class="track"><div class="fill" id="twist-lb1" style="width: 133px"></div></div><div class="val">0.303</div></div>
              <div class="row" id="twist-l2"><div class="who">Popularity<small>the usual bar to beat</small></div>
                <div class="track"><div class="fill" id="twist-lb2" style="width: 11px"></div></div><div class="val">0.024</div><span class="chip trap">TRAP</span></div>
              <div class="row" id="twist-l3"><div class="who">Last-read lookup<small>Markov chain</small></div>
                <div class="track"><div class="fill" id="twist-lb3" style="width: 139px"></div></div><div class="val">0.316</div></div>
            </div>
            <div class="note" id="twist-lnote">Beating popularity is where most write-ups stop. Against the lookup, the transformer <em>loses: 0.303 vs 0.316.</em></div>
          </div>

          <svg class="arrow" id="twist-arrow" viewBox="0 0 34 56" aria-hidden="true">
            <path d="M6 6 L27 28 L6 50" fill="none" stroke="#3fd8a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <div class="panel fix" id="twist-right" style="left: 980px">
            <span class="tag">NEXT · NOT BUILT YET</span>
            <div class="head">Blend: each wins a different step</div>
            <div class="rows">
              <div class="grp" id="twist-g1">Back to a series after other reads</div>
              <div class="row win" id="twist-r1"><div class="who">BERT4Rec</div>
                <div class="track"><div class="fill" id="twist-rb1" style="width: 203px"></div></div><div class="val">0.461</div><span class="chip pick">USE</span></div>
              <div class="row" id="twist-r2"><div class="who">Lookup</div>
                <div class="track"><div class="fill" id="twist-rb2" style="width: 165px"></div></div><div class="val">0.375</div></div>
              <div class="grp" id="twist-g2">Next format: article → dosing guide</div>
              <div class="row win" id="twist-r3"><div class="who">Lookup</div>
                <div class="track"><div class="fill" id="twist-rb3" style="width: 161px"></div></div><div class="val">0.365</div><span class="chip pick">USE</span></div>
              <div class="row" id="twist-r4"><div class="who">BERT4Rec</div>
                <div class="track"><div class="fill" id="twist-rb4" style="width: 102px"></div></div><div class="val">0.232</div></div>
            </div>
            <div class="note" id="twist-rnote">The README's next experiment: a blend, or BERT4Rec fed the lookup's score. <em>Not in the code yet.</em></div>
          </div>

          <div class="payoff" id="twist-payoff"><span class="tag">PAYOFF, AT MOST</span>
            <span>If each kind of step used its better model: NDCG@10 <b>0.331</b> vs <b>0.316</b> today</span>
            <span class="soft">· a ceiling, not a result</span></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 9;
          tl.fromTo("#twist-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#twist-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#twist-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#twist-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          // left: the lesson, with its evidence
          tl.fromTo("#twist-left", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          [1, 2, 3].forEach((n, i) => {
            tl.fromTo("#twist-l" + n, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.2 + i * 0.15);
            tl.fromTo("#twist-lb" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 1.3 + i * 0.15);
          });
          tl.fromTo("#twist-lnote", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3);
          // right: the next step and the slices that motivate it, then the most it could buy
          tl.fromTo("#twist-arrow", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.0);
          tl.fromTo("#twist-right", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.2);
          tl.fromTo(["#twist-g1", "#twist-g2"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.5);
          [1, 2, 3, 4].forEach((n, i) => {
            tl.fromTo("#twist-r" + n, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.6 + i * 0.15);
            tl.fromTo("#twist-rb" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 3.7 + i * 0.15);
          });
          tl.fromTo("#twist-rnote", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.9);
          tl.fromTo("#twist-payoff", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.6);
          // dip: fully out before the end card starts
          tl.to("#twist-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.8);
          window.__timelines["twist"] = tl;
        })();
      </script>
    </template>
